name: Health Sync CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: health-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  checks:
    name: Checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore Functions extensions
        run: dotnet restore src/HealthSync.Functions
      - name: Scan repository history for credentials
        if: runner.os == 'Linux'
        run: ./tools/Test-Secrets.ps1
      - name: Check timer metadata and Health sync behavior
        run: dotnet run --project tests/HealthSync.Checks -c Release
      - name: Build OAuth bootstrap tool
        run: dotnet build tools/HealthSync.Tool -c Release
      - name: Audit direct and transitive NuGet dependencies
        run: ./tools/Test-Dependencies.ps1
      - name: Publish Linux production package
        run: dotnet publish src/HealthSync.Functions -c Release -r linux-x64 --self-contained false -o artifacts/publish
      - name: Check package and deployment safety
        run: |
          ./tools/Test-Publish.ps1
          ./tests/Publish.Checks.ps1
          ./tests/Deployment.Checks.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        with:
          name: function-app
          path: artifacts/publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy Production
    needs: checks
    if: vars.HEALTH_SYNC_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOYMENT_TARGET_JSON: ${{ secrets.AZURE_DEPLOYMENT_TARGET_JSON }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: function-app
          path: artifacts/publish
      - name: Check OIDC configuration
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_DEPLOYMENT_TARGET_JSON')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Repository secret $name is missing; complete the one-time OIDC setup"
            }
          }
          $target = $env:AZURE_DEPLOYMENT_TARGET_JSON | ConvertFrom-Json
          if ($target.subscriptionId -ne $env:AZURE_SUBSCRIPTION_ID -or $target.tenantId -ne $env:AZURE_TENANT_ID) {
            throw 'Deployment target does not match the OIDC subscription and tenant'
          }
          $null = New-Item private -ItemType Directory -Force
          [IO.File]::WriteAllText('private/deployment-target.json', ($target | ConvertTo-Json))
          $settings = Get-Content infra/production.settings.example.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($entry in @{GOOGLE_CLIENT_ID='google-client-id';GOOGLE_CLIENT_SECRET='google-client-secret';GOOGLE_REFRESH_TOKEN='google-refresh-token';DRIVE_FILE_ID='drive-file-id'}.GetEnumerator()) {
            $settings[$entry.Key] = "@Microsoft.KeyVault(SecretUri=https://$($target.keyVault).vault.azure.net/secrets/$($entry.Value))"
          }
          [IO.File]::WriteAllText('private/deployment-settings.json', ($settings | ConvertTo-Json))
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy existing Flex Consumption app through ARM
        run: ./tools/Deploy-Production.ps1 -ReleaseId $env:RELEASE_ID -TargetPath private/deployment-target.json -SettingsPath private/deployment-settings.json
